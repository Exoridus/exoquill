[package]
name = "exoquill-ai"
description = "AI provider interfaces for ExoQuill: STT, OCR, formatter, TTS, VAD."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
exoquill-capture = { version = "0.1.0", path = "../exoquill-capture" }
exoquill-core = { version = "0.1.0", path = "../exoquill-core" }
serde = { version = "1.0.228", features = ["derive"] }
# Talks to the persistent whisper-server over localhost HTTP (multipart upload of
# WAV to /inference). Blocking is fine: the dictation worker is a plain thread.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "multipart",
    "json",
] }
