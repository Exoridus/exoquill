# Cargo workspace root for ExoQuill.
# The Tauri app lives in apps/desktop/src-tauri; shared logic in crates/*.
[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/*",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["ExoQuill contributors"]
repository = "https://github.com/Exoridus/exoquill"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Optimize dependencies even in dev builds (heavy C/DSP deps: whisper.cpp/ggml,
# resampling, ONNX Runtime) so dictation/read-aloud feel fast while developing,
# without slowing incremental rebuilds of our own crates.
[profile.dev.package."*"]
opt-level = 2
