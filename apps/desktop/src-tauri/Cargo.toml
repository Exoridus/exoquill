[package]
name = "exoquill-desktop"
description = "ExoQuill desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "exoquill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exoquill-core = { path = "../../../crates/exoquill-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
exoquill-db = { version = "0.1.0", path = "../../../crates/exoquill-db" }
exoquill-ai = { version = "0.1.0", path = "../../../crates/exoquill-ai" }
exoquill-audio = { version = "0.1.0", path = "../../../crates/exoquill-audio" }
exoquill-capture = { version = "0.1.0", path = "../../../crates/exoquill-capture" }
tauri-plugin-global-shortcut = "2.3.2"
# Inline the region screenshot as a data: URL for the selection overlay.
base64 = "0.22"
