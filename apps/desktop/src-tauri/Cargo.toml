[package]
name = "exoquill-desktop"
description = "ExoQuill desktop app (Tauri shell)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "exoquill_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exoquill-core = { path = "../../../crates/exoquill-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
exoquill-db = { version = "0.2.0", path = "../../../crates/exoquill-db" }
exoquill-ai = { version = "0.2.0", path = "../../../crates/exoquill-ai" }
exoquill-audio = { version = "0.2.0", path = "../../../crates/exoquill-audio" }
exoquill-capture = { version = "0.2.0", path = "../../../crates/exoquill-capture" }
tauri-plugin-global-shortcut = "2.3.2"
# Inline the region screenshot as a data: URL for the selection overlay.
base64 = "0.22"
# Download on-demand models (HuggingFace, https) for the model manager. rustls
# avoids native-tls/openssl on Windows; blocking is fine inside async commands.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }

[features]
# Kokoro is ON by default so the shipped app has a native neural TTS out of the box
# (CPU, faster than real time for the 82M model). It links ONNX Runtime via
# `load-dynamic` (dlopen at runtime, no native lib at build), and degrades
# gracefully to the other TTS providers when the model/onnxruntime.dll/espeak-ng
# aren't present — so a default build always compiles and runs. Build lean with
# `--no-default-features`.
default = ["kokoro"]
# Neural VAD for dictation (Silero ONNX). Off by default: needs onnxruntime + the
# model fetched separately (scripts/fetch-silero.ps1). Forwards to exoquill-audio.
silero = ["exoquill-audio/silero"]
# Native Kokoro-82M TTS (ONNX Runtime, no Python). Needs onnxruntime (load-dynamic),
# the espeak-ng binary + data, and a Kokoro model + voices — bundled for release
# (tauri.kokoro.conf.json) or fetched via the model manager (`tts-kokoro`,
# `tts-kokoro-de`). Forwards to exoquill-ai. Shares the exact `ort` version with
# `silero`, so both can be enabled together.
kokoro = ["exoquill-ai/kokoro"]
